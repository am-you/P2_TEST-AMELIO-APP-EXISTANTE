<div class="card m-3">
  <h5 class="card-header">Login</h5>
  <div class="card-body">
    <!-- Am.Yo : champs obligatoires login et password -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Login</label>
        <input
          type="text"
          formControlName="login"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && form['login'].errors }"
        />
        @if (submitted && form['login'].errors?.['required']) {
          <div class="invalid-feedback">
            <div>Login is required</div>
          </div>
        }
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          formControlName="password"
          class="form-control"
          [ngClass]="{ 'is-invalid': submitted && form['password'].errors }"
        />
        @if (submitted && form['password'].errors?.['required']) {
          <div class="invalid-feedback">
            <div>Password is required</div>
          </div>
        }
      </div>

      <!-- Am.Yo : états chargement, erreur, succès + token -->
      @if (loading) {
        <div class="alert alert-info">Signing in...</div>
      }
      @if (errorMessage) {
        <div class="alert alert-danger">{{ errorMessage }}</div>
      }
      @if (token) {
        <div class="alert alert-success">
          <div>Authentication successful</div>
          <div class="token">{{ token }}</div>
        </div>
      }

      <div class="text-center">
        <button class="btn btn-primary mr-1" [disabled]="loading">Sign in</button>
        <button class="btn btn-secondary" type="reset" (click)="onReset()" [disabled]="loading">
          Cancel
        </button>
      </div>
    </form>
  </div>
</div>
